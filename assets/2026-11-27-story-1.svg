<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 718" role="img"><rect width="700" height="718" fill="#e8e4da"/><text x="35" y="59" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#17242a">How the proposed cooling test works</text><rect x="35" y="92" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="92" width="8" height="127" fill="#ae6d43"/><text x="62" y="128" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Hot electrons</text><text x="62" y="159" font-family="Arial,sans-serif" font-size="19" fill="#46545b">Electrons in the modeled accretion flow help produce its radio-</text><text x="62" y="182" font-family="Arial,sans-serif" font-size="19" fill="#46545b">to-millimeter emission.</text><path d="M350 221 v19 m-7 -7 7 7 7 -7" fill="none" stroke="#ae6d43" stroke-width="2"/><rect x="35" y="244" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="244" width="8" height="127" fill="#263e49"/><text x="62" y="280" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Dark-matter scattering</text><text x="62" y="311" font-family="Arial,sans-serif" font-size="19" fill="#46545b">Lower-energy dark-matter particles could absorb energy through</text><text x="62" y="334" font-family="Arial,sans-serif" font-size="19" fill="#46545b">elastic scattering with electrons.</text><path d="M350 373 v19 m-7 -7 7 7 7 -7" fill="none" stroke="#ae6d43" stroke-width="2"/><rect x="35" y="396" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="396" width="8" height="127" fill="#263e49"/><text x="62" y="432" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Changed spectrum</text><text x="62" y="463" font-family="Arial,sans-serif" font-size="19" fill="#46545b">Extra electron cooling would change the flow’s predicted</text><text x="62" y="486" font-family="Arial,sans-serif" font-size="19" fill="#46545b">temperature profile and emission.</text><path d="M350 525 v19 m-7 -7 7 7 7 -7" fill="none" stroke="#ae6d43" stroke-width="2"/><rect x="35" y="548" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="548" width="8" height="127" fill="#263e49"/><text x="62" y="584" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Observational comparison</text><text x="62" y="615" font-family="Arial,sans-serif" font-size="19" fill="#46545b">The researchers compare predicted emission with observations</text><text x="62" y="638" font-family="Arial,sans-serif" font-size="19" fill="#46545b">accompanying the 2017 Event Horizon Telescope campaign.</text></svg>