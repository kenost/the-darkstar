<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 718" role="img"><rect width="700" height="718" fill="#e8e4da"/><text x="35" y="59" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#17242a">Two routes to accretion-column geometry</text><rect x="35" y="92" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="92" width="8" height="127" fill="#ae6d43"/><text x="62" y="128" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Simulated width</text><text x="62" y="159" font-family="Arial,sans-serif" font-size="19" fill="#46545b">The four modeled columns have angular widths ranging from about</text><text x="62" y="182" font-family="Arial,sans-serif" font-size="19" fill="#46545b">0.14 to 0.07 radians.</text><rect x="35" y="244" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="244" width="8" height="127" fill="#263e49"/><text x="62" y="280" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Estimated shock height</text><text x="62" y="311" font-family="Arial,sans-serif" font-size="19" fill="#46545b">Flow velocity and its gradient yield characteristic heights from</text><text x="62" y="334" font-family="Arial,sans-serif" font-size="19" fill="#46545b">1.95 to 3.89 kilometres.</text><rect x="35" y="396" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="396" width="8" height="127" fill="#263e49"/><text x="62" y="432" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Equivalent radius</text><text x="62" y="463" font-family="Arial,sans-serif" font-size="19" fill="#46545b">The authors calculate an area-equivalent radius for each</text><text x="62" y="486" font-family="Arial,sans-serif" font-size="19" fill="#46545b">simulated column for comparison with spectral modeling.</text><rect x="35" y="548" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="548" width="8" height="127" fill="#263e49"/><text x="62" y="584" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Spectral-fit range</text><text x="62" y="615" font-family="Arial,sans-serif" font-size="19" fill="#46545b">Three equivalent radii fall within the upper part of the range</text><text x="62" y="638" font-family="Arial,sans-serif" font-size="19" fill="#46545b">inferred using the bwcycl model.</text></svg>