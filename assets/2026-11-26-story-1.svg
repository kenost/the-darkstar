<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 718" role="img"><rect width="700" height="718" fill="#e8e4da"/><text x="35" y="59" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#17242a">Why a reaction rate shifts the gap</text><rect x="35" y="92" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="92" width="8" height="127" fill="#ae6d43"/><text x="62" y="128" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Helium burning</text><text x="62" y="159" font-family="Arial,sans-serif" font-size="19" fill="#46545b">Carbon-12 captures a helium nucleus to form oxygen-16, helping</text><text x="62" y="182" font-family="Arial,sans-serif" font-size="19" fill="#46545b">set the core composition.</text><path d="M350 221 v19 m-7 -7 7 7 7 -7" fill="none" stroke="#ae6d43" stroke-width="2"/><rect x="35" y="244" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="244" width="8" height="127" fill="#263e49"/><text x="62" y="280" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Stellar evolution</text><text x="62" y="311" font-family="Arial,sans-serif" font-size="19" fill="#46545b">Winds, rotation and mass-loss prescriptions alter how much</text><text x="62" y="334" font-family="Arial,sans-serif" font-size="19" fill="#46545b">helium-core material survives.</text><path d="M350 373 v19 m-7 -7 7 7 7 -7" fill="none" stroke="#ae6d43" stroke-width="2"/><rect x="35" y="396" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="396" width="8" height="127" fill="#263e49"/><text x="62" y="432" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">Pair instability</text><text x="62" y="463" font-family="Arial,sans-serif" font-size="19" fill="#46545b">The resulting core structure affects where pair-instability</text><text x="62" y="486" font-family="Arial,sans-serif" font-size="19" fill="#46545b">physics limits black-hole formation.</text><path d="M350 525 v19 m-7 -7 7 7 7 -7" fill="none" stroke="#ae6d43" stroke-width="2"/><rect x="35" y="548" width="630" height="127" rx="5" fill="#f4f0e8" stroke="#aeb0aa"/><rect x="35" y="548" width="8" height="127" fill="#263e49"/><text x="62" y="584" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#17242a">An inferred boundary</text><text x="62" y="615" font-family="Arial,sans-serif" font-size="19" fill="#46545b">The mass-gap edge depends on the stellar model, not just a</text><text x="62" y="638" font-family="Arial,sans-serif" font-size="19" fill="#46545b">single nuclear reaction rate.</text></svg>